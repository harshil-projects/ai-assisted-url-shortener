# Test profile, applied by the @TestProfile meta-annotation on every test class. In-memory H2 in the
# same PostgreSQL compatibility mode as dev so migrations are validated in one dialect.
# The database name carries a per-context random suffix: Spring caches and reuses test contexts, so
# two contexts with different properties live in one JVM at the same time, and a shared database let
# the previous context's asynchronous click recorder write while the next context ran Flyway
# (seen as a context failure in RateLimitIT under CPU load, T-002 gate run 3). One database per
# context removes the interaction; tests inside a context still clean their tables in @AfterEach.
spring.datasource.url=jdbc:h2:mem:urlshortener-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

app.api-key=test-api-key
app.ratelimit.create.capacity=100
app.security.actuator-requires-api-key=true
management.endpoint.health.show-details=always
logging.level.dev.harshil.shortener=INFO
