# Test profile, applied by the @TestProfile meta-annotation on every test class. In-memory H2 in the
# same PostgreSQL compatibility mode as dev so migrations are validated in one dialect.
spring.datasource.url=jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

app.api-key=test-api-key
app.ratelimit.create.capacity=100
app.security.actuator-requires-api-key=true
management.endpoint.health.show-details=always
logging.level.dev.harshil.shortener=INFO
