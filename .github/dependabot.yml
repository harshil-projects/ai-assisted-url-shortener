# Weekly dependency updates. Minor and patch bumps arrive grouped to keep the
# pull request count low. Majors arrive one per pull request so each can be
# reviewed and signed off; a dependency change is high impact under the
# harness policy.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Maven wrapper version is a deliberate pin (ADR 0001, enforcer range [3.9,4));
      # it is revisited with the design, not on the weekly cadence.
      - dependency-name: "org.apache.maven:apache-maven"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
