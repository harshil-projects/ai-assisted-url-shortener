name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out with full history for the harness commit-trailer rule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin 21 with a Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify on Linux, including the perf smoke profile
        if: runner.os == 'Linux'
        shell: bash
        run: ./mvnw -B -ntp -Pperf verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            **/target/spotbugsXml.xml
            **/target/checkstyle-result.xml
            harness-check/target/traceability.md

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out with full history so every commit is scanned
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v2 is pinned on purpose. It is the current major that runs on a personal
      # repository with only GITHUB_TOKEN. The design document names v3; adopt it
      # once it is published and its inputs have been verified.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release jar
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Temurin 21 with a Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package without rerunning tests (verify already ran for this commit)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload the application jar
        uses: actions/upload-artifact@v4
        with:
          name: url-shortener-jar
          path: url-shortener/target/*.jar
          if-no-files-found: error
