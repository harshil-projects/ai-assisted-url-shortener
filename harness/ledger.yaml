    rejected_notes: []
    debug:
      - { hypothesis: "Spotless fails on every file with InvocationTargetException because google-java-format needs jdk.compiler exports on JDK 21", finding: "partly confirmed. Running the formatter jar directly without exports gives IllegalAccessError on com.sun.tools.javac.util; with exports it still fails with NoClassDefFoundError org/commonmark/parser/Parser, a dependency new in 1.37.0 that the Spotless 3.10.4 step does not load", fix: "keep .mvn/jvm.config with the six exports and pin google-java-format to 1.36.1, the version Spotless 3.10.4 ships" }
      - { hypothesis: "ProblemDetails.toMap is safe for any ProblemDetail", finding: "refuted by ProblemDetailsTest. ProblemDetail.forStatus leaves type null, NullPointerException at toMap", fix: "default the type to about:blank as RFC 9457 specifies and read each getter once into a local" }
      - { hypothesis: "a bare ProblemDetail has no title", finding: "refuted. Spring fills title with the reason phrase; the test expectation was wrong", fix: "assert type, title, status and document the behaviour in the test" }
