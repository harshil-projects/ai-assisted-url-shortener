      - { hypothesis: "the first CI run on the baseline fails on Windows because the runner differs from the laptop", finding: "refuted. harness-check HC-12 flagged T-101 and T-102, planned tasks whose impact-analysis file is not written yet; the rule ran on CI because the baseline tag existed there", fix: "HC-12 applies to done tasks only; synthetic test hc12_ignoresPlannedTasksWhoseAnalysisDoesNotExistYet added" }
