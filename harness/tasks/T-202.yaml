id: T-202
title: Record click attribution (referrer host and campaign parameters) and expose it in stats
requirement: R-03
activities: [implement, test-gen]
impact: high
impact_reasons: [schema]
status: todo
depends_on: [T-201]
intent: >
  Implement the slice decided in T-201: store the referring site's host and the campaign
  parameters carried on the short link request with each click event, without any IP address,
  user agent, full referrer URL, geography or device data, and return top-ten breakdowns in the
  stats response. Migration V3 adds the four nullable columns one statement at a time.
constraints:
  - "V3__add_click_attribution.sql adds referrer_host VARCHAR(253), utm_source VARCHAR(64), utm_medium VARCHAR(64), utm_campaign VARCHAR(64) to click_events, one ALTER TABLE ... ADD COLUMN per statement, all nullable"
  - "Referer is parsed with java.net.URI on the request thread; only the lower-cased host is kept; absent or unparseable means null; the full URL is never stored or logged"
  - "utm_source, utm_medium and utm_campaign are read from the short link request query; control characters removed, truncated to 64 characters; every other query parameter is ignored"
  - "No IP address, user agent, geography or device value is derived or stored (ADR 0006 unchanged)"
  - "Query parameters on the short link are not forwarded to the destination; redirect behaviour from T-005 is unchanged"
  - "StatsResponse gains referrers and campaigns, each a list of at most ten rows ordered by clicks descending then name, all-time; existing fields unchanged"
  - "Breakdowns are two grouped queries over click_events for one link; no new index in this task, documented as a follow-up with the rollup table"
  - "ClickRecorded carries the attribution values so nothing from HttpServletRequest is read off the request thread"
  - "docs/reference/openapi.yaml is regenerated and docs/reference/api.md documents the new fields and the privacy position"
acceptance_criteria:
  - "WHEN a redirect request carries a Referer header with a parseable absolute URL THE SYSTEM SHALL store only its lower-cased host, at most 253 characters, with the click event [FR-15a]"
  - "IF the Referer header is absent or unparseable THEN THE SYSTEM SHALL store null for referrer_host and still record the click [FR-15a]"
  - "WHEN the short link request carries utm_source, utm_medium or utm_campaign THE SYSTEM SHALL store each value with control characters removed and truncated to 64 characters [FR-15b]"
  - "THE SYSTEM SHALL NOT store or log the client IP address, the user agent, the full referrer URL, or any geography or device value [FR-15c]"
  - "WHEN stats are requested THE SYSTEM SHALL include referrers (host, clicks) and campaigns (source, medium, campaign, clicks), each at most ten rows ordered by clicks descending, counted over all clicks of the link [FR-15d]"
  - "WHEN a short link is requested with query parameters THE SYSTEM SHALL redirect to the stored URL unchanged [FR-15e]"
  - "WHEN the application starts THE SYSTEM SHALL validate the V3 schema with ddl-auto=validate [NFR-10]"
technical_context:
  files:
    - url-shortener/src/main/resources/db/migration/V3__add_click_attribution.sql
    - domain/ClickEvent.java
    - domain/ClickRecorded.java
    - domain/ClickAttribution.java
    - api/RedirectController.java
    - api/dto/StatsResponse.java
    - api/dto/ReferrerStats.java
    - api/dto/CampaignStats.java
    - repository/ClickEventRepository.java
    - service/AnalyticsService.java
    - service/ClickRecorder.java
    - docs/reference/openapi.yaml
    - docs/reference/api.md
  interfaces:
    - "ClickAttribution.from(String refererHeader, Map<String, String[]> query) -> ClickAttribution(referrerHost, utmSource, utmMedium, utmCampaign)"
    - "ClickEventRepository.topReferrers(long linkId, int limit) -> List<ReferrerStats>"
    - "ClickEventRepository.topCampaigns(long linkId, int limit) -> List<CampaignStats>"
  patterns:
    - immutable event built on the request thread
    - one ALTER per column
    - privacy by data minimisation
  references:
    - "harness/requirements/R-03.md"
    - "docs/design/2026-10-12-system-design.md#3.5"
    - "docs/design/2026-10-12-system-design.md#3.6"
    - "docs/decisions/0006-no-ip-or-user-agent-persisted.md"
verification:
  - ClickAttributionTest
  - MigrationTest.v3AddsNullableAttributionColumns
  - ClickEventRepositoryTest.topReferrersAndCampaigns
  - AttributionIT.redirectWithRefererAndUtmShowsUpInStats
  - AttributionIT.redirectWithoutRefererRecordsNullHost
  - AttributionIT.queryParametersAreNotForwarded
  - OpenApiIT.committedSpecMatchesRuntime
